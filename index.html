<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a2540" />
  <title>eQuiz — Live Interactive Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a2540;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero ───────────────────────────────────────────── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 36px;
      text-align: center;
      gap: 0;
    }

    /* Brand mark */
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .brand-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2a9df4 0%, #1254a3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 8px 28px rgba(42,157,244,0.35);
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1;
      color: #fff;
    }
    .brand-name .accent { color: #2a9df4; }

    .tagline {
      font-size: 16px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-bottom: 44px;
    }

    /* ── Two main actions ───────────────────────────────── */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 14px;
    }

    .action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 30px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      border: none;
    }
    .action-card:hover  { transform: translateY(-3px); }
    .action-card:active { transform: scale(0.97); }

    .card-icon  { font-size: 38px; line-height: 1; }
    .card-label { font-size: 17px; font-weight: 900; color: inherit; }
    .card-sub   { font-size: 12px; opacity: 0.7; font-weight: 500; }

    /* Host — vivid blue */
    .card-host {
      background: linear-gradient(135deg, #2a9df4 0%, #1254a3 100%);
      color: #fff;
      box-shadow: 0 8px 32px rgba(42,157,244,0.28);
    }
    /* Join — glass */
    .card-join {
      background: rgba(255,255,255,0.07);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.14);
    }
    .card-join:hover { background: rgba(255,255,255,0.12); }

    /* ── Secondary links row ────────────────────────────── */
    .link-row {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }
    .ghost-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .ghost-link:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.06);
    }

    /* ── QR join section ────────────────────────────────── */
    .qr-section {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 22px 28px;
      max-width: 440px;
      width: 100%;
    }
    .qr-section img {
      width: 84px;
      height: 84px;
      border-radius: 10px;
      background: #fff;
      flex-shrink: 0;
    }
    .qr-info { text-align: left; }
    .qr-info strong {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }
    .qr-info p {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .qr-info code {
      font-size: 11px;
      background: rgba(42,157,244,0.12);
      border: 1px solid rgba(42,157,244,0.25);
      border-radius: 6px;
      padding: 3px 8px;
      color: #2a9df4;
      word-break: break-all;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.18);
      border-top: 1px solid rgba(255,255,255,0.05);
      letter-spacing: 0.3px;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 420px) {
      .brand-name { font-size: 40px; }
      .brand-icon { width: 54px; height: 54px; font-size: 20px; }
      .qr-section { flex-direction: column; text-align: center; }
      .qr-info { text-align: center; }
      .link-row { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <main class="hero">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">eQ</div>
      <div class="brand-name">e<span class="accent">Quiz</span></div>
    </div>
    <p class="tagline">Live interactive quizzes for your training sessions</p>

    <!-- Primary actions -->
    <div class="action-grid">
      <a href="host.html" class="action-card card-host">
        <span class="card-icon">🖥️</span>
        <span class="card-label">Host</span>
        <span class="card-sub">Project &amp; control</span>
      </a>
      <a href="join.html" class="action-card card-join">
        <span class="card-icon">📱</span>
        <span class="card-label">Join</span>
        <span class="card-sub">Answer from phone</span>
      </a>
    </div>

    <!-- Secondary links -->
    <div class="link-row">
      <a href="leaderboard.html" class="ghost-link">🏆 Leaderboard</a>
      <a href="report.html" class="ghost-link">📋 Report</a>
    </div>

    <!-- QR to join -->
    <div class="qr-section">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https%3A%2F%2Fezhamq.netlify.app%2Fjoin.html"
        alt="QR code — scan to join"
      />
      <div class="qr-info">
        <strong>Scan to join on your phone</strong>
        <p>Point your camera at the QR code<br>or open the URL below</p>
        <code>ezhamq.netlify.app/join.html</code>
      </div>
    </div>

  </main>

  <footer>eQuiz &nbsp;·&nbsp; Live Quiz Platform</footer>
</body>
</html>
