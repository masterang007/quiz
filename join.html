<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a2540" />
  <title>Join · DCS Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Mobile player full-screen layout ─────────────── */
    body { background: var(--navy-900); }

    .player-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Join form card sits centred on the navy bg */
    #join-card {
      margin: 20px 16px;
      background: var(--white);
      border-radius: var(--radius);
    }

    /* Answer screen fills the whole viewport */
    #answer-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 16px;
      gap: 10px;
    }

    /* Top status bar */
    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 0;
    }
    .player-topbar .timer {
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
    }
    .player-topbar .timer.warn { background: var(--amber); }
    .player-topbar .timer.crit { background: var(--red); }

    /* 2×2 grid of big answer buttons */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .answer-btn {
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: transform 0.08s, box-shadow 0.1s, opacity 0.15s;
      position: relative;
      min-height: 110px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .answer-btn input[type=radio] { display: none; }
    .answer-btn:active { transform: scale(0.94); }

    .answer-a { background: #e74c3c; }
    .answer-b { background: #2471b5; }
    .answer-c { background: #d4a017; }
    .answer-d { background: #1e9d55; }

    /* Selected — white ring */
    .answer-btn.selected {
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.9);
      transform: scale(0.96);
    }

    /* After reveal */
    .answer-btn.correct {
      background: #1e9d55 !important;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.95);
    }
    .answer-btn.wrong {
      background: #7a1f17 !important;
      opacity: 0.55;
    }

    /* Locked (no interaction) */
    #player-options[data-locked] .answer-btn { cursor: default; }

    /* Status message */
    #player-message {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      padding: 4px 0;
    }

    /* Score + Rank row */
    .player-score-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .player-score-box {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
    }
    .player-score-box .ps-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.7;
    }
    .player-score-box .ps-value {
      font-size: 22px;
      font-weight: 900;
      margin-top: 2px;
    }

    /* Config warning */
    #config-warning {
      margin: 16px;
      background: var(--red-bg);
      color: var(--red);
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="player-shell">

    <div id="config-warning" hidden>
      Firebase is not configured. Ask the host to finish setup.
    </div>

    <!-- ── JOIN FORM ─────────────────────────────── -->
    <section class="card" id="join-card">
      <h2>Join Quiz</h2>
      <p class="subtitle" id="player-state">Waiting for host.</p>

      <form id="join-form" novalidate>
        <label for="player-name">Full name</label>
        <input id="player-name" type="text" maxlength="60"
               placeholder="e.g. John Smith" autocomplete="name" required />

        <label for="player-department">Department</label>
        <select id="player-department" required>
          <option value="" disabled selected>Select your department</option>
          <option value="Operations">Operations</option>
          <option value="Process">Process</option>
          <option value="Instrument">Instrument</option>
          <option value="Electrical">Electrical</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Engineering">Engineering</option>
        </select>

        <div class="btn-row">
          <button type="submit" class="btn">Join Quiz</button>
        </div>
      </form>
    </section>

    <!-- ── ANSWER SCREEN ─────────────────────────── -->
    <section id="answer-card" hidden>

      <!-- Category · Q number · Timer -->
      <div class="player-topbar">
        <span>
          <span id="player-category"></span>
          &nbsp;·&nbsp;
          <span id="player-question-number">0 / 0</span>
        </span>
        <span class="timer" id="player-timer">--</span>
      </div>

      <!-- Waiting screen (shown when no question is active) -->
      <div id="player-waiting-screen" style="
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:18px;
        text-align:center;
      ">
        <div id="waiting-icon" style="font-size:56px;">⏳</div>
        <div id="waiting-title" style="color:#fff;font-size:22px;font-weight:800;line-height:1.3;">
          Waiting for host<br>to start the quiz…
        </div>
        <div id="waiting-subtitle" style="color:rgba(255,255,255,0.5);font-size:14px;">
          Look at the projector screen
        </div>
        <div style="
          width:48px;height:6px;border-radius:999px;
          background:rgba(255,255,255,0.15);
          overflow:hidden;
          margin-top:8px;
        ">
          <div style="
            height:100%;width:40%;border-radius:999px;
            background:var(--accent);
            animation:slide 1.4s ease-in-out infinite;
          "></div>
        </div>
        <style>
          @keyframes slide {
            0%   { transform: translateX(-100%); }
            50%  { transform: translateX(150%); }
            100% { transform: translateX(150%); }
          }
        </style>
      </div>

      <!-- A B C D buttons (shown only when question is live) -->
      <div class="answer-grid" id="player-options" hidden>
        <!-- Rendered by live.js -->
      </div>

      <!-- Status line -->
      <div id="player-message">Look at the screen and tap your answer.</div>

      <!-- Score + Rank -->
      <div class="player-score-row">
        <div class="player-score-box">
          <div class="ps-label">Score</div>
          <div class="ps-value" id="player-score">0 pts</div>
        </div>
        <div class="player-score-box">
          <div class="ps-label">Rank</div>
          <div class="ps-value" id="player-rank">—</div>
        </div>
      </div>

    </section>

  </div><!-- .player-shell -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="questions.js"></script>
  <script src="live.js"></script>
  <script>DCSLiveQuiz.player.init();</script>
</body>
</html>
